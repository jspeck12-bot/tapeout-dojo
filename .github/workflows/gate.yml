name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install independent Verilog simulator
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: npm run lint
      - run: npm run format:check
      - run: npm run gate
      - run: npm run test:rtl
      - run: npm run build
