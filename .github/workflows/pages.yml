name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Token cannot enable the GitHub Actions Pages product via API (needs
# administration:write). Publish the Vite bundle to the gh-pages branch
# instead; Settings → Pages → Deploy from branch → gh-pages / root.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build GitHub Pages bundle
        run: npm run build
        env:
          GH_PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
